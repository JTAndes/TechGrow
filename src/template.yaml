AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  TechGrow - Arquitectura Serverless para Predicción de Demanda en Restaurantes
  (EventBridge -> Step Functions -> Glue Jobs & Lambda APIs -> S3 Medallon -> Lambda Modelo -> S3 Modelo -> QuickSight)

Resources:

  # ==========================================
  # 1. CAPAS DE ALMACENAMIENTO (S3 BUCKETS)
  # ==========================================

  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: techgrow-medallon
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ModelPredictionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: techgrow-modelo
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ==========================================
  # 2. PROCESAMIENTO ETL (AWS GLUE JOBS)
  # ==========================================

  GlueMedallionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: techgrow-glue-medallon-etl
      Role: !GetAtt GlueExecutionRole.Arn
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${DataLakeBucket}/scripts/etl_medallon.py"
      DefaultArguments:
        "--job-bookmark-option": "job-bookmark-enable"
      MaxRetries: 0
      Timeout: 60
      WorkerType: G.1X
      NumberOfWorkers: 2
      ExecutionProperty:
        MaxConcurrentRuns: 1

  # ==========================================
  # 3. GLUE DATA CATALOG & CRAWLER
  # ==========================================

  DataLakeGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: techgrow_medallon_db
        Description: "Base de datos del Data Lake para las capas Bronze, Silver y Gold"

  GoldTableCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: techgrow-gold-crawler
      Role: !GetAtt GlueExecutionRole.Arn
      DatabaseName: !Ref DataLakeGlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DataLakeBucket}/gold/"
      Schedule:
        ScheduleExpression: "cron(0 7 ? * MON *)" # Se ejecuta los lunes a las 7 AM (después del pipeline ETL)

  # ==========================================
  # 4. GOBIERNO DE IDENTIDAD Y ACCESO (IAM ROLES & POLICIES)
  # ==========================================

  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: techgrow-glue-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GlueS3AndCatalogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataLakeBucket.Arn
                  - !Sub "${DataLakeBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - glue:*
                Resource: "*"

  StateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: techgrow-stepfunction-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionOrchestrationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ApiCollectorLambda.Arn
                  - !GetAtt PredictionModelLambda.Arn
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:BatchStopJobRun
                Resource: "*"

  EventBridgeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: techgrow-scheduler-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SchedulerToStepFunctionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref PredictionStateMachine

  # ==========================================
  # 5. RED Y SEGURIDAD PERIMETRAL (VPC & WAF)
  # ==========================================

  TechGrowVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: techgrow-secure-vpc

  TechGrowPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TechGrowVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: techgrow-private-subnet

  TechGrowSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security Group para aislar recursos serverless en VPC"
      VpcId: !Ref TechGrowVPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: techgrow-sg

  TechGrowWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: techgrow-waf-protection
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: TechGrowWAFMetrics
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: CommonRulesMetric
            SampledRequestsEnabled: true

  # ==========================================
  # 6. FUNCIONES LAMBDA (APIs y Modelo)
  # ==========================================

  ApiCollectorLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: techgrow-api-collector
      Handler: index.handler
      Runtime: python3.11
      CodeUri: src/api_collector/
      MemorySize: 256
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !Ref TechGrowSecurityGroup
        SubnetIds:
          - !Ref TechGrowPrivateSubnet
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataLakeBucket
          PREFIX_APIS: "apis-context/"

  PredictionModelLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: techgrow-prediction-model
      Handler: index.handler
      Runtime: python3.11
      CodeUri: src/model_inference/
      MemorySize: 1024
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref TechGrowSecurityGroup
        SubnetIds:
          - !Ref TechGrowPrivateSubnet
      Environment:
        Variables:
          GOLD_BUCKET: !Ref DataLakeBucket
          APIS_BUCKET: !Ref DataLakeBucket
          OUTPUT_BUCKET: !Ref ModelPredictionsBucket

  # ==========================================
  # 7. ORQUESTACIÓN (STEP FUNCTIONS)
  # ==========================================

  PredictionStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: techgrow-pipeline-orquestador
      DefinitionUri: statemachine/workflow.asl.json
      DefinitionSubstitutions:
        ApiCollectorLambdaArn: !GetAtt ApiCollectorLambda.Arn
        PredictionModelLambdaArn: !GetAtt PredictionModelLambda.Arn
        GlueJobName: !Ref GlueMedallionJob
      Role: !GetAtt StateMachineExecutionRole.Arn

  # ==========================================
  # 8. DISPARADOR AUTOMÁTICO (EVENTBRIDGE)
  # ==========================================

  WeeklyEventBridgeSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: techgrow-weekly-trigger
      Description: "Dispara la máquina de estados de Step Functions semanalmente (Lunes a las 6:00 AM)"
      ScheduleExpression: "cron(0 6 ? * MON *)"
      State: ENABLED
      FlexibleTimeWindow:
        Mode: OFF
      Target:
        Arn: !Ref PredictionStateMachine
        RoleArn: !GetAtt EventBridgeSchedulerRole.Arn

Outputs:
  DataLakeBucketName:
    Description: "Nombre del Data Lake Medallón S3"
    Value: !Ref DataLakeBucket
  ModelPredictionsBucketName:
    Description: "Nombre del bucket S3 de Modelo para QuickSight"
    Value: !Ref ModelPredictionsBucket
  GlueJobName:
    Description: "Nombre del Glue Job de Medallón"
    Value: !Ref GlueMedallionJob
  GlueDatabaseName:
    Description: "Nombre de la base de datos de Glue Catalog"
    Value: !Ref DataLakeGlueDatabase
  StateMachineArn:
    Description: "ARN de la máquina de estados de Step Functions"
    Value: !Ref PredictionStateMachine
  VpcId:
    Description: "ID de la VPC segura"
    Value: !Ref TechGrowVPC
  WebAclArn:
    Description: "ARN del WAF Web ACL"
    Value: !GetAtt TechGrowWebACL.Arn
